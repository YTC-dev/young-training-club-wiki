<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>404 · Không tìm thấy trang - YTC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <script>
    // Keep relative assets and navigation anchored at the site root, even when
    // the host serves this page for a missing URL several folders deep.
    const siteBase = window.location.pathname.startsWith("/young-training-club-wiki/")
      ? "/young-training-club-wiki"
      : "";
    document.write(`<base href="${siteBase}/">`);
  </script>
  <link rel="stylesheet" href="Asset/style.css">
  <link rel="icon" type="image/png" href="Image/YTC-Favicon.png">
  <style>
    .error-page {
      min-height: calc(100vh - 90px);
      display: grid;
      place-items: center;
      padding: 56px 20px 80px;
      position: relative;
      overflow: hidden;
    }

    .error-page::before,
    .error-page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }

    .error-page::before {
      width: 420px;
      height: 420px;
      top: 2%;
      left: -180px;
      background: rgba(81, 194, 242, .2);
    }

    .error-page::after {
      width: 360px;
      height: 360px;
      right: -120px;
      bottom: 4%;
      background: rgba(9, 131, 254, .13);
    }

    .error-card {
      width: min(860px, 100%);
      position: relative;
      z-index: 1;
      padding: clamp(32px, 7vw, 68px) clamp(22px, 7vw, 72px);
      border: 1px solid rgba(126, 214, 255, .55);
      border-radius: 30px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 24px 70px rgba(44, 59, 144, .16), 0 0 0 8px rgba(255, 255, 255, .22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
    }

    .error-orbit {
      width: clamp(140px, 25vw, 180px);
      height: clamp(140px, 25vw, 180px);
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background: linear-gradient(145deg, #04006b, #2c3b90 54%, #0983fe);
      box-shadow: 0 18px 36px rgba(4, 0, 107, .28), 0 0 0 10px rgba(126, 214, 255, .16);
    }

    .error-orbit::before,
    .error-orbit::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .38);
      border-radius: 50%;
      transform: rotate(-28deg);
    }

    .error-orbit::before { width: 128%; height: 40%; }
    .error-orbit::after { width: 40%; height: 128%; }

    .error-code {
      color: #fff;
      font-size: clamp(3rem, 9vw, 5.2rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.08em;
      text-shadow: 0 7px 18px rgba(0, 0, 0, .2);
    }

    .error-kicker svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }
    .error-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 14px;
      border: 1px solid rgba(9, 131, 254, .22);
      border-radius: 999px;
      color: var(--blue-main);
      background: rgba(230, 248, 255, .78);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .error-card h1 {
      margin-bottom: 12px;
      color: var(--blue-dark);
      font-size: clamp(1.65rem, 4vw, 2.45rem);
      line-height: 1.16;
    }

    .error-card p {
      max-width: 540px;
      margin: 0 auto;
      color: var(--text-body);
      font-size: 1rem;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .error-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid rgba(9, 131, 254, .22);
      border-radius: 999px;
      color: var(--blue-main);
      background: #fff;
      text-decoration: none;
      font-weight: 750;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast), color var(--transition-fast);
    }

    .error-action:hover {
      transform: translateY(-3px);
      color: #fff;
      background: linear-gradient(135deg, var(--blue-main), var(--blue-accent));
      box-shadow: var(--shadow-hover);
    }

    .error-action--primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue-main), var(--blue-accent));
    }

    .error-action--primary:hover { background: linear-gradient(135deg, var(--blue-dark), var(--blue-main)); }

    .error-action svg { width: 17px; height: 17px; }

    .error-note {
      margin-top: 24px !important;
      color: var(--text-muted) !important;
      font-size: .84rem !important;
    }

    @media (max-width: 560px) {
      .error-page { padding: 30px 14px 56px; }
      .error-card { border-radius: 22px; }
      .error-actions { flex-direction: column; }
      .error-action { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-orbit" aria-hidden="true">
        <span class="error-code">404</span>
      </div>
      <div class="error-kicker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg>
        Trang không tồn tại
      </div>
      <h1 id="error-title">Ơ, hình như bạn đi lạc rồi!</h1>
      <p>Liên kết này có thể đã bị đổi tên, bị xóa hoặc chưa từng tồn tại. Đừng lo, YTC vẫn ở ngay đây để đưa bạn trở lại đúng đường.</p>

      <div class="error-actions">
        <a class="error-action error-action--primary" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10Z"/><path d="M9 22V12h6v10"/></svg>
          Về trang chủ
        </a>
        <a class="error-action" href="wiki.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 0-2.5 2.5Z"/><path d="M6.5 17H20"/></svg>
          Khám phá Wiki
        </a>
        <a class="error-action" href="member.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Xem thành viên
        </a>
      </div>
      <p class="error-note">Mã lỗi: 404 · Young Training Club Wiki</p>
    </section>
  </main>

  <footer>
    <div id="footer-placeholder"></div>
  </footer>

  <script src="Asset/script.js"></script>
</body>
</html>
